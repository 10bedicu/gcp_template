# Default values for dcm4chee DICOM server
# Cloud provider (gcp, aws, azure, etc.)
global:
  cloudProvider: null
  namespace: ""
  gateway:
    name: ""
    namespace: ""
    gatewayClassName: ""
  backendPolicy:
    enabled: false
    securityPolicy: ""
    logging:
      enabled: false
      # Integer between 0 and 1000000; GKE divides it by 1000000.
      sampleRate: 100000
  httpRoute:
    enabled: false

# --- LDAP (slapd-dcm4chee) ---
ldap:
  image:
    repository: dcm4che/slapd-dcm4chee
    pullPolicy: IfNotPresent
    tag: "2.6.8-34.1"
  replicaCount: 1
  service:
    port: 389
  storage:
    endpoint: "https://storage.googleapis.com"
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      cpu: 500m
      memory: 512Mi

# --- DCM4CHEE Arc (DICOM archive server) ---
arc:
  image:
    repository: dcm4che/dcm4chee-arc-psql
    pullPolicy: IfNotPresent
    tag: "5.34.1"
  replicaCount: 1
  service:
    port: 8080
  resources:
    requests:
      cpu: 500m
      memory: 2Gi
    limits:
      cpu: "2"
      memory: 4Gi

# --- OHIF Viewer ---
ohif:
  image:
    repository: ohif/app
    pullPolicy: IfNotPresent
    tag: "v3.9.2"
  replicaCount: 1
  service:
    port: 80
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      cpu: 500m
      memory: 512Mi

# --- Nginx Proxy ---
nginx:
  image:
    repository: nginx
    pullPolicy: IfNotPresent
    tag: "alpine"
  replicaCount: 1
  service:
    type: ClusterIP
    port: 80
  resources:
    requests:
      cpu: 50m
      memory: 64Mi
    limits:
      cpu: 200m
      memory: 128Mi
  # URL of care backend authentication endpoint
  authBackendUrl: "http://care-backend-care-be:9000/api/care_radiology/dicom/authenticate/"
  clientMaxBodySize: "100M"

# --- DICOM Configuration ---
# Base URL for OHIF viewer to access DCM4CHEE (e.g., https://dicom.example.com)
dicomBaseUrl: ""

# --- Service Account ---
serviceAccount:
  create: true
  annotations: {}
  name: ""

nameOverride: ""
fullnameOverride: ""

podAnnotations: {}
podSecurityContext: {}
securityContext: {}

imagePullSecrets: []
nodeSelector: {}
tolerations: []
affinity: {}

envFromSecret: []

# --- Secrets (set via Terraform set_sensitive) ---
secret:
  enabled: false
  data: {}
    # POSTGRES_DB: ""
    # POSTGRES_USER: ""
    # POSTGRES_PASSWORD: ""
    # POSTGRES_HOST: ""
    # DATABASE_URL: ""
    # LDAP_ADMIN_PASSWORD: "secret"
    # DICOM_BUCKET_NAME: ""
    # GCS_ACCESS_KEY: ""
    # GCS_SECRET_KEY: ""

# --- Database Migration Job ---
migration:
  enabled: true
  backoffLimit: 3
  ttlSecondsAfterFinished: 600

# --- GCP Backend Policy ---
backendPolicy:
  enabled: "{{ .Values.global.backendPolicy.enabled }}"
  securityPolicy: "{{ .Values.global.backendPolicy.securityPolicy }}"
  timeoutSec: 60
  drainingTimeoutSec: 60
  healthCheck:
    checkIntervalSec: 10
    timeoutSec: 5
    healthyThreshold: 1
    unhealthyThreshold: 3
    port: 80
    path: /

# --- HTTP Route ---
httpRoute:
  enabled: "{{ .Values.global.httpRoute.enabled }}"
  gatewayName: "{{ .Values.global.gateway.name }}"
  annotations: {}
  hostnames: []
