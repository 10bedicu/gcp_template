{{- if .Values.migrationJob.enabled }}
apiVersion: batch/v1
kind: Job
metadata:
  name: {{ include "care-be.fullname" . }}-migration
  labels:
    {{- include "care-be.labels" . | nindent 4 }}
    app.kubernetes.io/component: migration
  annotations:
    "helm.sh/hook": post-install,post-upgrade
    "helm.sh/hook-weight": "5"
    "helm.sh/hook-delete-policy": before-hook-creation,hook-succeeded
spec:
  backoffLimit: {{ .Values.migrationJob.backoffLimit | default 3 }}
  ttlSecondsAfterFinished: {{ .Values.migrationJob.ttlSecondsAfterFinished | default 86400 }}
  template:
    metadata:
      annotations:
        {{- with .Values.podAnnotations }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      labels:
        {{- include "care-be.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: migration
    spec:
      restartPolicy: Never
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      serviceAccountName: {{ include "care-be.serviceAccountName" . }}
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
      containers:
        - name: {{ .Chart.Name }}-migration
          securityContext:
            {{- toYaml .Values.securityContext | nindent 12 }}
          {{- if .Values.registry.enabled }}
          {{- $registryHost := .Values.registry.host }}
          {{- $registryPort := .Values.registry.port }}
          {{- $imageRepo := .Values.image.repository }}
          {{- $imageTag := .Values.image.tag | default .Chart.AppVersion }}
          {{- if $registryPort }}
          image: "{{ $registryHost }}:{{ $registryPort }}/{{ $imageRepo }}:{{ $imageTag }}"
          {{- else }}
          image: "{{ $registryHost }}/{{ $imageRepo }}:{{ $imageTag }}"
          {{- end }}
          {{- else }}
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag | default .Chart.AppVersion }}"
          {{- end }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          {{- if .Values.migrationJob.command }}
          command:
            {{- toYaml .Values.migrationJob.command | nindent 12 }}
          {{- end }}
          {{- if or .Values.env .Values.envFromSecretKey }}
          env:
            {{- range .Values.env }}
            - name: {{ .name }}
              {{- if .valueFrom }}
              valueFrom:
                {{- if .valueFrom.secretKeyRef }}
                secretKeyRef:
                  name: {{ .valueFrom.secretKeyRef.name }}
                  key: {{ .valueFrom.secretKeyRef.key }}
                {{- end }}
                {{- if .valueFrom.configMapKeyRef }}
                configMapKeyRef:
                  name: {{ .valueFrom.configMapKeyRef.name }}
                  key: {{ .valueFrom.configMapKeyRef.key }}
                {{- end }}
              {{- else }}
              value: {{ .value | quote }}
              {{- end }}
            {{- end }}
            {{- range .Values.envFromSecretKey }}
            - name: {{ .name }}
              valueFrom:
                secretKeyRef:
                  name: {{ .secretName }}
                  key: {{ .key }}
            {{- end }}
          {{- end }}
          {{- if or .Values.envFromConfigMap .Values.envFromSecret (and .Values.configMap.enabled .Values.configMap.data) (and .Values.secret.enabled .Values.secret.data) }}
          envFrom:
            {{- range .Values.envFromConfigMap }}
            - configMapRef:
                name: {{ .name }}
                {{- if .prefix }}
                prefix: {{ .prefix }}
                {{- end }}
            {{- end }}
            {{- range .Values.envFromSecret }}
            - secretRef:
                name: {{ .name }}
                {{- if .prefix }}
                prefix: {{ .prefix }}
                {{- end }}
            {{- end }}
            {{- if and .Values.configMap.enabled .Values.configMap.data }}
            - configMapRef:
                name: {{ include "care-be.fullname" . }}-config
            {{- end }}
            {{- if and .Values.secret.enabled .Values.secret.data }}
            - secretRef:
                name: {{ include "care-be.fullname" . }}-secret
            {{- end }}
          {{- end }}
          resources:
            {{- toYaml (.Values.migrationJob.resources | default .Values.resources) | nindent 12 }}
          volumeMounts:
            - name: production-logging
              mountPath: /app/config/settings/production_logging.py
              subPath: production_logging.py
              readOnly: true
          {{- with .Values.volumeMounts }}
            {{- toYaml . | nindent 12 }}
          {{- end }}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      volumes:
        - name: production-logging
          configMap:
            name: {{ include "care-be.fullname" . }}-production-logging
      {{- with .Values.volumes }}
        {{- toYaml . | nindent 8 }}
      {{- end }}
{{- end }}

