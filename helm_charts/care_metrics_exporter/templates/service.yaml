apiVersion: v1
kind: Service
metadata:
  name: {{ include "care-metrics-exporter.fullname" . }}
  labels:
    {{- include "care-metrics-exporter.labels" . | nindent 4 }}
spec:
  type: ClusterIP
  selector:
    {{- include "care-metrics-exporter.selectorLabels" . | nindent 4 }}
  ports:
    - name: metrics
      port: 8000
      targetPort: metrics
      protocol: TCP
