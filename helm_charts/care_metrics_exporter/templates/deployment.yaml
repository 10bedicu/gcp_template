apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "care-metrics-exporter.fullname" . }}
  labels:
    {{- include "care-metrics-exporter.labels" . | nindent 4 }}
    app.kubernetes.io/component: metrics-exporter
    app.kubernetes.io/part-of: care
spec:
  replicas: 1
  selector:
    matchLabels:
      {{- include "care-metrics-exporter.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      {{- with .Values.podAnnotations }}
      annotations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      labels:
        {{- include "care-metrics-exporter.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: metrics-exporter
        app.kubernetes.io/part-of: care
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: exporter
          image: "{{ required "image.repository is required" .Values.image.repository }}:{{ required "image.tag is required" .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - name: metrics
              containerPort: 8000
              protocol: TCP
          env:
            - name: CELERY_BROKER_URL
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.brokerSecret.name }}
                  key: {{ .Values.brokerSecret.key }}
            - name: CELERY_QUEUES
              value: {{ .Values.queue | quote }}
            - name: LOG_LEVEL
              value: {{ .Values.logLevel | quote }}
          livenessProbe:
            httpGet:
              path: /healthz
              port: metrics
            initialDelaySeconds: 5
            periodSeconds: 20
            timeoutSeconds: 3
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /healthz
              port: metrics
            initialDelaySeconds: 2
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
